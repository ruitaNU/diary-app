


    <h1>日記アプリ</h1>

    <!-- 今日・昨日ボタン -->
    <div class="quick-buttons">
        <button onclick="goToday()">今日</button>
        <button onclick="goYesterday()">昨日</button>
    </div>

    <!-- カレンダー -->
    <input type="date" id="datePicker">

    <!-- 日記本文 -->
    <textarea id="diary" placeholder="今日の出来事を書こう…"></textarea>
    <button onclick="saveDiary()">保存する</button>

    <script>
        const datePicker = document.getElementById("datePicker");
        const diary = document.getElementById("diary");

        // 今日の日付をセット
        const today = new Date().toISOString().split("T")[0];
        datePicker.value = today;

        // 日付が変わったら読み込み
        datePicker.addEventListener("change", loadDiary);

        // 日記を読み込む
        function loadDiary() {
            const key = "diary_" + datePicker.value;
            diary.value = localStorage.getItem(key) || "";
        }

        // 日記を保存
        function saveDiary() {
            const key = "diary_" + datePicker.value;
            localStorage.setItem(key, diary.value);
            alert("保存しました！");
        }

        // 今日ボタン
        function goToday() {
            datePicker.value = today;
            loadDiary();
        }

        // 昨日ボタン
        function goYesterday() {
            const d = new Date();
            d.setDate(d.getDate() - 1);
            const y = d.toISOString().split("T")[0];
            datePicker.value = y;
            loadDiary();
        }

        // 初期読み込み
        loadDiary();
    </script>

</body>
</html>
