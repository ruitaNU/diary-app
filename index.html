<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日記アプリ</title>
    <style>
        body {
            font-family: sans-serif;
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
            background: #f7f7f7;
        }
        h1 {
            text-align: center;
        }
        textarea {
            width: 100%;
            height: 300px;
            padding: 10px;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            font-size: 16px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 6px;
        }
    </style>
</head>
<body>

    <h1>日記アプリ</h1>

    <textarea id="diary" placeholder="今日の出来事を書こう…"></textarea>
    <button onclick="saveDiary()">保存する</button>

    <script>
        // 保存した日記を読み込む
        document.getElementById("diary").value = localStorage.getItem("myDiary") || "";

        // 保存ボタンが押されたら保存
        function saveDiary() {
            const text = document.getElementById("diary").value;
            localStorage.setItem("myDiary", text);
            alert("保存しました！");
        }
    </script>

</body>
</html>
